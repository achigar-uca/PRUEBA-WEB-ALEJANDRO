<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Alejandro - World of Warcraft Style</title>
    
    <!-- Fuentes tipográficas de estilo fantástico/medieval de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Metamorphous&family=Quicksand:wght@500&display=swap" rel="stylesheet">

    <style>
        /* Fondo inspirado en la estética de WoW (oscuro, con textura de degradado y borde dorado) */
        body {
            background-color: #2b0b14;
            background-image: 
                radial-gradient(circle at center, #7a1532 0%, #300612 70%, #0d0105 100%);
            background-attachment: fixed;
            color: #f0e6d2; /* Blanco cálido / pergamino */
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Título en formato h2 con estética de logotipo o interfaz de World of Warcraft */
        h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff4d1;
            /* Efecto de texto grabado en oro con sombra dorada brillante */
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.6),
                2px 2px 4px rgba(0, 0, 0, 0.9),
                -1px -1px 0 #b38f38, 
                 1px -1px 0 #b38f38,
                -1px  1px 0 #b38f38,
                 1px  1px 0 #b38f38;
            border-bottom: 2px solid #c89b3c;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Texto descriptivo */
        p {
            font-size: 1.1rem;
            color: #e6d5b8;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            text-align: center;
        }

        /* Marco metálico/dorado al estilo de la interfaz de usuario de WoW para el video */
        .wow-frame {
            border: 4px solid #c89b3c;
            outline: 2px solid #4a3814;
            box-shadow: 
                0 0 15px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(200, 155, 60, 0.4);
            border-radius: 4px;
            background-color: #000;
            line-height: 0;
        }

        iframe {
            border: none;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <h2>Alejandro de la Chica García</h2>
    
    <p>Este es un texto de ejemplo para que veas cómo queda la letra blanca sobre el fondo rosa.</p>

    <!-- Video de YouTube incrustado en marco estilo WoW -->
    <div class="wow-frame">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/19LesCL7dus" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

</body>
</html>
